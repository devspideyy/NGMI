<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGMI Prop Pack v2 — 3D viewer</title>
<style>
:root{--bg:#050c08;--panel:#0b1711;--line:#183527;--g:#46ff86;--txt:#d6eadc;--dim:#8fa597}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 8px}
h1{margin:0;font-size:20px;letter-spacing:.4px}
h1 span{color:var(--g)}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
#stage{position:relative;height:58vh;min-height:320px;background:#030805;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
#nm{color:var(--g);font-weight:700;font-size:16px;text-shadow:0 1px 3px #000}
#meta{color:#b9cdbf;font-size:12.5px;text-shadow:0 1px 3px #000;max-width:62vw}
#controls{pointer-events:auto;display:flex;gap:6px;flex-shrink:0}
.btn{font:inherit;font-size:13px;background:#0f2219;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;cursor:pointer}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap}
.on{border-color:var(--g)!important;color:#eafff0;background:#123a24!important}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;padding:2px 12px 18px}
.chip{font:inherit;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--txt);cursor:pointer}
.chip b{display:block;font-size:13.5px}
.chip span{display:block;color:var(--dim);font-size:12px;margin-top:2px}
#load{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--g);font-size:14px;background:rgba(3,8,5,.35)}
#err{display:none;position:absolute;top:10px;left:12px;right:12px;color:#ffb4b4;font-size:13px}
footer{color:var(--dim);font-size:12px;padding:0 16px 26px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<header>
  <h1><span>NGMI</span> · Prop Pack v2</h1>
  <div class="sub">All in-house models, real-world scale. Drag to rotate, pinch or scroll to zoom. Tap a name below.</div>
</header>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="load">Loading…</div>
  <div id="err"></div>
  <div id="hud">
    <div><div id="nm"></div><div id="meta"></div></div>
    <div id="controls"><button class="btn" id="spin">Spin: on</button><button class="btn" id="lights">Light: clinic</button></div>
  </div>
</div>
<nav id="tabs"></nav>
<main id="list"></main>
<footer>These are the plain base colours the FBX files carry into Unreal; in UE5 they get Megascans materials, Lumen lighting and the green grade. Everything here is fictional.</footer>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const DATA = __DATA__;
const SHEETS = __SHEETS__;
const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030805);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.3;
const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

const key = new THREE.DirectionalLight(0xfff0dc, 2.2);
const rim = new THREE.DirectionalLight(0x46ff86, 3.0);
const fill = new THREE.HemisphereLight(0x9fdcb5, 0x020403, 0.25);
scene.add(key, rim, fill);
const floorMat = new THREE.MeshStandardMaterial({color: 0x040806, roughness: 0.85, metalness: 0.0});
const floor = new THREE.Mesh(new THREE.CircleGeometry(1, 64), floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.32, 0.35, 0.96);
composer.addPass(bloom);
composer.addPass(new OutputPass());

let clinic = true;
function setLights(size) {
  const s = size;
  key.position.set(-1.6 * s, 2.2 * s, 2.4 * s);
  rim.position.set(1.8 * s, 1.6 * s, -2.2 * s);
  key.intensity = clinic ? 2.2 : 2.8;
  rim.color.set(clinic ? 0x46ff86 : 0xffffff);
  rim.intensity = clinic ? 3.0 : 1.4;
  fill.intensity = clinic ? 0.25 : 0.7;
  scene.environmentIntensity = clinic ? 0.3 : 0.75;
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const loader = new GLTFLoader();
const cache = {};
function load(name) {
  if (!cache[name]) cache[name] = fetch('models/SM_' + name + '.json').then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(a => {
      const bin = atob(a[0]);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return loader.parseAsync(bytes.buffer, '');
    }).then(g => g.scene);
  return cache[name];
}
let current = null, currentName = null;
async function show(item) {
  currentName = item.n;
  $('load').style.display = 'flex';
  $('err').style.display = 'none';
  try {
    const names = [item.n].concat(item.pair ? [item.pair] : []);
    const parts = await Promise.all(names.map(load));
    if (currentName !== item.n) return;
    if (current) scene.remove(current);
    const g = new THREE.Group();
    parts.forEach((p, i) => {
      const c = p.clone(true);
      if (i === 1 && item.n.startsWith('RetainerChatterer')) c.rotation.x = -0.5;
      g.add(c);
    });
    scene.add(g);
    current = g;
    const box = new THREE.Box3().setFromObject(g);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const r = Math.max(size.x, size.y, size.z);
    floor.scale.setScalar(r * 3);
    floor.position.y = box.min.y - r * 0.002;
    controls.target.copy(center);
    const dist = r / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.5;
    camera.position.set(center.x + dist * 0.45, center.y + dist * 0.28, center.z + dist * 0.85);
    camera.near = r / 200; camera.far = r * 60; camera.updateProjectionMatrix();
    controls.minDistance = r * 0.3; controls.maxDistance = r * 8;
    setLights(r);
    $('nm').textContent = 'SM_' + item.n;
    $('meta').textContent = item.note + ' · ' + item.t.toLocaleString() + ' tris · ' +
      item.d.map(v => v >= 1 ? v.toFixed(2) + ' m' : Math.round(v * 100) + ' cm').join(' × ');
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.n === item.n));
  } catch (e) {
    $('err').textContent = 'Could not load this model: ' + e.message;
    $('err').style.display = 'block';
  } finally {
    $('load').style.display = 'none';
  }
}

let tab = 1;
function renderTabs() {
  $('tabs').innerHTML = '';
  SHEETS.forEach((t, i) => {
    const n = DATA.filter(d => d.s === i && !d.hidden).length;
    const b = document.createElement('button');
    b.className = 'btn tab' + (i === tab ? ' on' : '');
    b.textContent = t + ' (' + n + ')';
    b.onclick = () => { tab = i; renderTabs(); renderList(); };
    $('tabs').appendChild(b);
  });
}
function renderList() {
  $('list').innerHTML = '';
  DATA.filter(d => d.s === tab && !d.hidden).forEach(d => {
    const b = document.createElement('button');
    b.className = 'chip' + (d.n === currentName ? ' on' : '');
    b.dataset.n = d.n;
    b.innerHTML = '<b></b><span></span>';
    b.querySelector('b').textContent = d.n.replace(/_/g, ' ');
    b.querySelector('span').textContent = d.note;
    b.onclick = () => { show(d); window.scrollTo({top: 0, behavior: 'smooth'}); };
    $('list').appendChild(b);
  });
}
$('spin').onclick = () => { controls.autoRotate = !controls.autoRotate; $('spin').textContent = 'Spin: ' + (controls.autoRotate ? 'on' : 'off'); };
$('lights').onclick = () => {
  clinic = !clinic; $('lights').textContent = 'Light: ' + (clinic ? 'clinic' : 'studio');
  if (current) setLights(new THREE.Box3().setFromObject(current).getSize(new THREE.Vector3()).length() / 1.7);
};
renderTabs(); renderList(); resize();
show(DATA.find(d => d.n === 'NeonSign_Ascension') || DATA[0]);
renderer.setAnimationLoop(() => { controls.update(); composer.render(); });
</script>
</body>
</html>
